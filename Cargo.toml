[package]
name = "ass-acc"
version = "0.4.0"
edition = "2024"
description = "Program for parsing and uploading financial statements"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
confy = "2.0.0"
csv = "1.4.0"
image = { version = "0.25.9", default-features = false, features = ["jpeg"] }
ocrs = "0.12.1"
pdf-extract = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["multipart", "stream"] }
rten = "0.24.0"
rten-imageproc = "0.24.0"
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_regex = "1.1.0"
tokio = { version = "1.49.0", features = ["full"] }
