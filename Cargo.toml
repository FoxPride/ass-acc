[package]
name = "ass-acc"
version = "0.1.0"
edition = "2024"
description = "Program for parsing and uploading financial statements"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.52", features = ["derive"] }
confy = "2.0.0"
csv = "1.4.0"
image = { version = "0.25.9", default-features = false, features = ["jpeg"] }
ocrs = "0.11.0"
pdf-extract = "0.10.0"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["multipart", "stream"] }
rten = "=0.22.1"
scraper = "0.24.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_regex = "1.1.0"
tokio = { version = "1.48.0", features = ["full"] }
